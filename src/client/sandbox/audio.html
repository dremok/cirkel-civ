<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sandbox: audio</title>
    <style>
      :root { --paper: #f7f2e8; --ink: #2a2622; --muted: #7a6f62; --rule: #d9cfbf; --accent: #3460d9; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, 'Inter', sans-serif; }
      main { max-width: 860px; margin: 0 auto; padding: 28px 16px 64px; }
      h1 { font: 500 30px/1.1 Georgia, 'Fraunces', serif; margin: 0 0 4px; }
      h2 { font: 600 11px/1 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; }
      p.lead { color: var(--muted); margin: 0 0 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      button { font: inherit; color: var(--ink); background: #fffdf8; border: 1px solid var(--rule); border-radius: 10px; padding: 9px 14px; min-height: 40px; cursor: pointer; transition: background .18s cubic-bezier(.2,.7,.2,1), border-color .18s; }
      button:hover { border-color: #bfb3a0; }
      button:active { background: #efe7d8; }
      button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
      .sliders { display: grid; grid-template-columns: 90px 1fr 44px; gap: 6px 12px; align-items: center; max-width: 520px; }
      .sliders span { color: var(--muted); font-variant-numeric: tabular-nums; }
      input[type=range] { width: 100%; accent-color: var(--accent); }
      #status { font-variant-numeric: tabular-nums; color: var(--muted); }
      #ticks { display: flex; gap: 6px; margin-top: 10px; }
      #ticks i { width: 26px; height: 6px; border-radius: 3px; background: var(--rule); transition: background .12s; }
      #ticks i.lit { background: var(--accent); }
      code { background: #efe7d8; padding: 1px 5px; border-radius: 5px; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ljud</h1>
      <p class="lead">Audition every sound, the buses and a fake replay. Click anywhere first to unlock audio.</p>
      <p id="status"></p>

      <h2>Buses</h2>
      <div class="sliders" id="sliders"></div>
      <div class="row" style="margin-top:10px"><button id="mute">Mute</button></div>

      <h2>Music</h2>
      <div class="row" id="music"></div>
      <h2>Ambience</h2>
      <div class="row" id="amb"></div>

      <h2>Interface</h2>
      <div class="row" id="ui"></div>

      <h2>Battle and economy</h2>
      <div class="sliders"><label for="pan">Pan</label><input id="pan" type="range" min="-1" max="1" step="0.1" value="0" /><span id="panv">0</span></div>
      <div class="row" id="sfx" style="margin-top:10px"></div>

      <h2>Fake replays</h2>
      <p class="lead">Scheduled with <code>audio.onEvents(events, secPerTick, { me: 0, prev, pan })</code>, self-clocked.</p>
      <div class="row" id="replays"></div>
      <div id="ticks"></div>
    </main>
    <script type="module" src="./audio.ts"></script>
  </body>
</html>
